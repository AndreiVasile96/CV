name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Nothing below runs if these fail, so a broken build cannot reach
      # production. Previously the pipeline was build -> deploy, and the test
      # suite was never executed in CI at all.
      - name: Lint
        run: npm run lint

      - name: Unit and accessibility tests
        run: npm run test:ci
        env:
          CI: true

      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build project
        run: npm run build
        env:
          # CRA inlines REACT_APP_* at build time, so these must be present in
          # the CI build or the contact form ships with no credentials and every
          # submission fails. These are EmailJS's public/browser identifiers -
          # never add the EmailJS private key here, it would be served to
          # visitors. Lock the service down with EmailJS allowed-origins instead.
          REACT_APP_EMAILJS_SERVICE_ID: ${{ secrets.REACT_APP_EMAILJS_SERVICE_ID }}
          REACT_APP_EMAILJS_TEMPLATE_ID: ${{ secrets.REACT_APP_EMAILJS_TEMPLATE_ID }}
          REACT_APP_EMAILJS_PUBLIC_KEY: ${{ secrets.REACT_APP_EMAILJS_PUBLIC_KEY }}

      # jsdom has no layout engine, so unit tests cannot see that this page
      # scrolls document.body rather than the document. This drives the real
      # build in a real browser instead.
      - name: Smoke test the built site
        run: npm run test:smoke

      - name: Check Firebase Service Account Secret
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT is not set"
            exit 1
          else
            echo "FIREBASE_SERVICE_ACCOUNT is set"
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: personal-cv-bba06
